<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Select Seats - MovieBook</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- Navigation -->

    <nav class="navbar">

        <div class="logo">
            🎬 MovieBook
        </div>

        <div class="nav-links">

            <a href="index.html">Home</a>

            <a href="movies.html">Movies</a>

        </div>

    </nav>


    <!-- Seat Selection -->

    <section class="section">

        <h2>Select Your Seats</h2>


        <p>
            Showtime:
            <strong id="showTime"></strong>
        </p>


        <!-- Seat Legend -->

        <div class="legend">

            <span>🟩 Available</span>

            <span>⬜ Booked</span>

            <span>🟥 Selected</span>

        </div>


        <!-- Seats -->

        <div id="seatGrid"
             class="seat-grid">

            <div class="loading">
                Loading seats...
            </div>

        </div>


        <!-- Selected Seats -->

        <h3>

            Selected Seats:

            <span id="selectedSeats">
                None
            </span>

        </h3>


        <br>


        <!-- Total -->

        <h3>

            Total:

            ₹<span id="totalAmount">
                0
            </span>

        </h3>


        <br>


        <button
            class="btn"
            onclick="continueToBooking()">

            Continue to Booking

        </button>

    </section>


    <script src="js/config.js"></script>

    <script src="js/api.js"></script>

    <script src="js/seats.js"></script>

</body>

</html>
