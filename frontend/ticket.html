<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Digital Ticket - MovieBook</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

    <nav class="navbar">

        <div class="logo">
            🎬 MovieBook
        </div>

        <div class="nav-links">

            <a href="index.html">Home</a>

            <a href="movies.html">Movies</a>

            <a href="history.html">My Bookings</a>

        </div>

    </nav>


    <section class="section">

        <h2>🎟️ Booking Confirmed</h2>


        <div class="ticket-card">

            <h2>MovieBook</h2>

            <hr>


            <p>
                <strong>Booking ID:</strong>
                <span id="bookingId">
                    Loading...
                </span>
            </p>


            <p>
                <strong>Movie:</strong>
                <span id="movieName">
                    Loading...
                </span>
            </p>


            <p>
                <strong>Showtime:</strong>
                <span id="showTime">
                    Loading...
                </span>
            </p>


            <p>
                <strong>Seats:</strong>
                <span id="seatNames">
                    Loading...
                </span>
            </p>


            <p>
                <strong>Total:</strong>
                ₹<span id="totalAmount">
                    0
                </span>
            </p>


            <br>


            <button
                class="btn"
                onclick="window.print()">

                Print Ticket

            </button>


            <button
                class="btn"
                onclick="window.location.href='movies.html'">

                Book Another Movie

            </button>

        </div>

    </section>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ticket.js"></script>

</body>

</html>
