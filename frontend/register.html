<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - MovieBook</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

    <nav class="navbar">

        <div class="logo">
            🎬 MovieBook
        </div>

        <div class="nav-links">

            <a href="index.html">Home</a>

            <a href="login.html">Login</a>

        </div>

    </nav>


    <section class="section">

        <div class="auth-card">

            <h2>Create Account</h2>


            <form id="registerForm">

                <input
                    type="text"
                    id="name"
                    placeholder="Full Name"
                    required
                >


                <input
                    type="email"
                    id="registerEmail"
                    placeholder="Email"
                    required
                >


                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Password"
                    required
                >


                <button
                    type="submit"
                    class="btn">

                    Register

                </button>

            </form>


            <p>

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </section>


    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>

</body>

</html>
