<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Booking Summary - MovieBook</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

    <!-- Navigation -->

    <nav class="navbar">

        <div class="logo">
            🎬 MovieBook
        </div>

        <div class="nav-links">

            <a href="index.html">Home</a>

            <a href="movies.html">Movies</a>

        </div>

    </nav>


    <!-- Booking Summary -->

    <section class="section">

        <h2>Booking Summary</h2>


        <div class="booking-card">

            <h3>Movie</h3>

            <p id="movieName">
                Loading...
            </p>


            <h3>Showtime</h3>

            <p id="showTime">
                Loading...
            </p>


            <h3>Selected Seats</h3>

            <p id="seatNames">
                Loading...
            </p>


            <h3>Total Amount</h3>

            <p>
                ₹<span id="totalAmount">
                    0
                </span>
            </p>


            <br>


            <button
                class="btn"
                onclick="confirmBooking()">

                Confirm Booking

            </button>

        </div>

    </section>


    <script src="js/config.js"></script>

    <script src="js/api.js"></script>

    <script src="js/booking.js"></script>

</body>

</html>
