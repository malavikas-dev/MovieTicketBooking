<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - MovieBook</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

    <nav class="navbar">

        <div class="logo">
            🎬 MovieBook
        </div>

        <div class="nav-links">

            <a href="index.html">Home</a>

            <a href="movies.html">Movies</a>

            <a href="register.html">Register</a>

        </div>

    </nav>


    <section class="section">

        <div class="auth-card">

            <h2>Login</h2>


            <form id="loginForm">

                <input
                    type="email"
                    id="email"
                    placeholder="Email"
                    required
                >


                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                >


                <button
                    type="submit"
                    class="btn">

                    Login

                </button>

            </form>


            <p>
                Don't have an account?

                <a href="register.html">
                    Register
                </a>

            </p>

        </div>

    </section>


    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>

</body>

</html>
